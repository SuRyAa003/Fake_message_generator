<div class="container-fluid p-3">

    <div class="row">
    
        <!-- Left Side Area -->
        <div class="col-md-4">
            <div class="card shadow-sm rounded-1">
                <div class="card-body">

                    <ul class="nav nav-underline " id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" 
                            aria-controls="pills-home" aria-selected="true">
                            <i class="bi bi-phone-fill"></i>  Phone Settings
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="pills-message-tab" data-bs-toggle="pill" data-bs-target="#pills-message" type="button" role="tab" 
                            aria-controls="pills-message" aria-selected="false">
                                <i class="bi bi-pencil-fill"></i> Messages 
                            </button>
                        </li>
                    </ul>
                        <div class="tab-content" id="pills-tabContent">
                            <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab" tabindex="0">
                                <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <!-- Platform Area -->
                                        <div class="">
                                            <pre class="fw-semibold text-secondary my-2">Platform</pre>
                                            <button class="btn btn-outline-primary" id="pills-apple-tab" data-bs-toggle="pill" data-bs-target="#pills-apple-tab" type="button" role="tab" aria-controls="pills-apple-tab" aria-selected="true">
                                                <i class="bi bi-apple"></i> iPhone
                                            </button>
                                        </div>

                                        <!-- Appearance Area -->
                                        <div class="">
                                            <pre class="fw-semibold text-secondary my-2">Appearance</pre>
                                            <ul class=" bg-secondary-subtle nav nav-pills nav-fill gap-2 p-1 small  rounded-4 shadow-sm" id="pillNav2" role="tablist" style="--bs-nav-link-color: var(--bs-white); --bs-nav-pills-link-active-color: var(--bs-primary); --bs-nav-pills-link-active-bg: var(--bs-white);">
                                                <li class="nav-item" role="presentation">
                                                    <button class="nav-link active rounded-4" id="home-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="true">
                                                        iMessage (Blue)
                                                    </button>
                                                </li>
                                                <li class="nav-item" role="presentation">
                                                    <button class="nav-link rounded-4" id="profile-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="false">
                                                        Text Message (Green)
                                                    </button>
                                                </li>
                                            </ul>
                                        </div>

                                        <!-- Status Bar Area -->
                                        <div class="">
                                            <pre class="fw-semibold text-secondary my-2">Status Bar</pre>
                                            <div class=" p-3 rounded-2" style="background: rgb(249, 250, 251)">

                                                <form action="">

                                                    <div class="d-flex justify-content-between">
                                                        <div class="">
                                                            <label for="">Time</label>
                                                            <div class="input-group">
                                                                <span class="input-group-text" id="basic-addon1"><i class="bi bi-clock"></i></span>
                                                                <input type="text" class="form-control" aria-describedby="basic-addon1">
                                                            </div>
                                                        </div>
                                                        <div class="">
                                                            <label for="">Battery %</label>
                                                            <div class="input-group">
                                                                <span class="input-group-text" id="basic-addon2"><i class="bi bi-battery-full"></i></span>
                                                                <input type="number" class="form-control" aria-describedby="basic-addon2">
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    <div class="form-check form-switch my-3">
                                                        <input class="form-check-input" type="checkbox" role="switch" id="switchCheckChecked">
                                                        <label class="form-check-label" for="switchCheckChecked">Show Battery %</label>
                                                    </div>
                                                    

                                                    <!--  -->
                                                    <div class="">

                                                        <label for="">Connection</label>
                                                        <div class="input-group mb-3">

                                                            <span class="input-group-text" id="basic-addon3"><i class="bi bi-bar-chart-fill"></i></span>
                                                            <select class="form-select form-select-sm rounded-end" aria-describedby="basic-addon3">
                                                                <option selected>WiFi</option>
                                                                 @for (item of connectionsList;track item){
                                                                     <option [value]="{item}">{{item}}</option>
                                                                 }
                                                            </select>
                                                        </div>

                                                        
                                                    </div>


                                                </form>

                                            </div>

                                        </div>

                                        <!-- Contact Info Area -->
                                        <div class="">
                                            <pre class="fw-semibold text-secondary my-2">Contact Info</pre>
                                            <div class=" p-3 rounded-2" style="background: rgb(249, 250, 251)">

                                                <form action="">

                                                    <div class="">
                                                        <div class="">
                                                            <label for="">Name</label>
                                                            <input type="text" class="form-control form-control-sm">
                                                        </div>
                                                        <div class="">
                                                            <label for="">Status / Subtitle</label>
                                                            <input type="text" class="form-control form-control-sm">
                                                        </div>
                                                    </div>

                                                </form>

                                            </div>

                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="pills-message" role="tabpanel" aria-labelledby="pills-message-tab" tabindex="0">...</div>
                        </div>

                </div>
            </div>
        </div>
    
        <!-- Right Side Area -->
        <div class="col-md-8">
            <div class="card shadow-sm rounded-1">
                <div class="card-body">

                     <div class="tab-content" id="pills-tabContent">
                                <div class="tab-pane fade show active" id="pills-apple-tab" role="tabpanel" aria-labelledby="pills-apple-platform-tab" tabindex="0">
                                    <h1>Iphone Modal</h1>



                                    <div class="border  border-4 rounded-5">


                                    </div>



                                </div>

                          
                                <!-- <div class="tab-pane fade show" id="pills-android-tab" role="tabpanel" aria-labelledby="pills-android-tab" tabindex="0">
                                    <h1>Android phone Modal</h1>
                                </div> -->
                          
                            </div>

                </div>
            </div>
        </div>
    </div>

</div>
